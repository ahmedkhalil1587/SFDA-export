<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة أدوية SFDA</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #0b5ed7;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0a4fb5;
    }
    .meta {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>قائمة الأدوية البشرية المسجلة</h1>
    <p>آخر نسخة محدّثة تلقائيًا من موقع الهيئة العامة للغذاء والدواء (SFDA)</p>
    <a class="btn" href="data/SFDA_Drugs_latest.xlsx" download>
      تحميل آخر نسخة (Excel)
    </a>
    <div class="meta">
      يتم تحديث الملف تلقائيًا أول كل شهر
    </div>
  </div>
</body>
</html>
