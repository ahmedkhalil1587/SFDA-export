<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFDA Updates</title>
  <link rel="icon" type="image/jpeg" href="assets/integriox-badge.jpeg" />
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
      color: #6b7280;
    }
    .topbar .user-name { font-weight: 600; color: #1a1a2e; }
    .topbar a {
      color: #0b5ed7;
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #0b5ed7;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover {
      background: #0a4fb5;
    }
    .meta {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
    .source-block {
      margin-bottom: 22px;
      padding-bottom: 22px;
      border-bottom: 1px solid #eef0f3;
    }
    .source-block:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .source-title {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .brand-header img {
      max-width: 140px;
      width: 100%;
      height: auto;
    }
    .footer-brand {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      color: #b8bfc9;
      letter-spacing: 0.3px;
    }
    #app { display: none; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="brand-header">
      <img src="assets/integriox-logo-light.jpeg" alt="integriox" />
    </div>
    <div class="topbar">
      <span>أهلاً، <span class="user-name" id="user-name"></span></span>
      <span>
        <a href="admin.html" id="admin-link" style="display:none;">لوحة الأدمن</a>
        <a href="#" id="logout-link" style="margin-right:10px;">خروج</a>
      </span>
    </div>
    <h1>قائمة الأدوية البشرية المسجلة</h1>
    <p>نسخ محدّثة تلقائيًا من موقعي الهيئة العامة للغذاء والدواء (SFDA)</p>

    <div class="source-block">
      <div class="source-title">الموقع القديم (oldsfda.sfda.gov.sa)</div>
      <a class="btn" href="data/SFDA_Drugs_latest.xlsx" download id="download-btn">
        تحميل النسخة (Excel)
      </a>
      <div class="meta" id="last-updated">جاري التحميل...</div>
    </div>

    <div class="source-block">
      <div class="source-title">الموقع الجديد (sfda.gov.sa)</div>
      <a class="btn" href="data/SFDA_Drugs_New_latest.xlsx" download id="download-btn-new">
        تحميل النسخة (Excel)
      </a>
      <div class="meta" id="last-updated-new">جاري التحميل...</div>
    </div>
  </div>

  <div class="footer-brand">Powered by integriox</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbys4Ak1MaJY2-K5r3WgZ1NWiqGonafK1emuhmNLolyrAeZAe8Pfg0UocD3v21UEofpoYg/exec";

    (async function guardPage() {
      const token = localStorage.getItem("mdl_token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(`${WEB_APP_URL}?action=checkSession&token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.success) {
          localStorage.removeItem("mdl_token");
          localStorage.removeItem("mdl_user");
          window.location.href = "login.html";
          return;
        }

        document.getElementById("user-name").textContent = data.user.name;
        if (data.user.role === "Admin") {
          document.getElementById("admin-link").style.display = "inline";
        }
        document.getElementById("app").style.display = "block";
        loadLastUpdated();
        loadLastUpdatedNew();
      } catch (e) {
        window.location.href = "login.html";
      }
    })();

    async function loadLastUpdated() {
      try {
        const res = await fetch(`data/last_updated.json?t=${Date.now()}`);
        const meta = await res.json();
        document.getElementById("last-updated").textContent =
          `آخر تحديث: ${meta.date} — عدد الأدوية: ${meta.count.toLocaleString("ar-EG")}`;

        const downloadBtn = document.getElementById("download-btn");
        downloadBtn.href = `data/${meta.datedFileName}`;
        downloadBtn.setAttribute("download", meta.datedFileName);
      } catch (e) {
        document.getElementById("last-updated").textContent = "لسه مفيش نسخة متاحة";
      }
    }

    async function loadLastUpdatedNew() {
      try {
        const res = await fetch(`data/last_updated_new.json?t=${Date.now()}`);
        const meta = await res.json();
        document.getElementById("last-updated-new").textContent =
          `آخر تحديث: ${meta.date} — عدد الأدوية: ${meta.count.toLocaleString("ar-EG")}`;

        const downloadBtnNew = document.getElementById("download-btn-new");
        downloadBtnNew.href = `data/${meta.datedFileName}`;
        downloadBtnNew.setAttribute("download", meta.datedFileName);
      } catch (e) {
        document.getElementById("last-updated-new").textContent = "لسه مفيش نسخة متاحة";
      }
    }

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("mdl_token");
      if (token) {
        try { await fetch(`${WEB_APP_URL}?action=logout&token=${encodeURIComponent(token)}`); } catch (err) {}
      }
      localStorage.removeItem("mdl_token");
      localStorage.removeItem("mdl_user");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
