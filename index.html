<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFDA Updates</title>
  <link rel="icon" type="image/jpeg" href="assets/integriox-badge.jpeg" />
  <style>
    :root {
      --accent: #0b5ed7;
      --accent-dark: #0a4fb5;
      --accent-soft: #eaf2fd;
      --ink: #171923;
      --muted: #6b7280;
      --border: #e6e8ec;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      margin: 0;
      background:
        radial-gradient(1100px 500px at 15% -10%, #eaf2fd 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 110%, #eef1f6 0%, transparent 55%),
        #f6f7f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 12px 32px -8px rgba(16,24,40,0.12);
      padding: 36px 34px 30px;
      width: 100%;
      text-align: center;
    }
    .brand-header { margin-bottom: 8px; }
    .brand-header img {
      max-width: 150px;
      width: 100%;
      height: auto;
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0 22px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .topbar .user-name { font-weight: 700; color: var(--ink); }
    .topbar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    h1 {
      font-size: 19px;
      color: var(--ink);
      margin: 0 0 6px;
    }
    p.lead {
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 24px;
    }
    .source-block {
      margin-bottom: 20px;
      padding: 18px;
      background: #fbfbfc;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: right;
    }
    .source-block:last-of-type { margin-bottom: 0; }
    .source-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.05s;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn:active { transform: translateY(1px); }
    .meta {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer-brand {
      text-align: center;
      margin-top: 22px;
      font-size: 11.5px;
      color: #a7adb8;
      letter-spacing: 0.2px;
    }
    #app { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="app">
      <div class="brand-header">
        <img src="assets/integriox-logo-light.jpeg" alt="integriox" />
      </div>
      <div class="topbar">
        <span>أهلاً، <span class="user-name" id="user-name"></span></span>
        <span>
          <a href="admin.html" id="admin-link" style="display:none;">لوحة الأدمن</a>
          <a href="#" id="logout-link" style="margin-right:10px;">خروج</a>
        </span>
      </div>
      <div class="divider"></div>

      <h1>قائمة الأدوية البشرية المسجلة</h1>
      <p class="lead">نسخ محدّثة تلقائيًا من موقعي الهيئة العامة للغذاء والدواء (SFDA)</p>

      <div class="source-block" id="source-old" style="display:none;">
        <a class="btn" href="data/SFDA_Drugs_latest.xlsx" download id="download-btn">
          تحميل النسخة (Excel)
        </a>
        <div class="meta" id="last-updated">جاري التحميل...</div>
      </div>

      <div class="source-block" id="source-new" style="display:none;">
        <a class="btn" href="data/SFDA_Drugs_New_latest.xlsx" download id="download-btn-new">
          تحميل النسخة (Excel)
        </a>
        <div class="meta" id="last-updated-new">جاري التحميل...</div>
      </div>
    </div>

    <div class="footer-brand">Powered by integriox</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbys4Ak1MaJY2-K5r3WgZ1NWiqGonafK1emuhmNLolyrAeZAe8Pfg0UocD3v21UEofpoYg/exec";

    (async function guardPage() {
      const token = localStorage.getItem("mdl_token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(`${WEB_APP_URL}?action=checkSession&token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.success) {
          localStorage.removeItem("mdl_token");
          localStorage.removeItem("mdl_user");
          window.location.href = "login.html";
          return;
        }

        document.getElementById("user-name").textContent = data.user.name;
        if (data.user.role === "Admin") {
          document.getElementById("admin-link").style.display = "inline";
        }
        document.getElementById("app").style.display = "block";
        loadSettingsAndSources();
      } catch (e) {
        window.location.href = "login.html";
      }
    })();

    async function loadSettingsAndSources() {
      let settings = { show_old_source: true, show_new_source: true };
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getSettings`);
        const data = await res.json();
        if (data.success) settings = data.settings;
      } catch (e) {
        // لو فشل الطلب، سيبي الاتنين ظاهرين افتراضيًا
      }

      const sourceOld = document.getElementById("source-old");
      const sourceNew = document.getElementById("source-new");

      if (settings.show_old_source !== false) {
        sourceOld.style.display = "block";
        loadLastUpdated();
      }

      if (settings.show_new_source !== false) {
        sourceNew.style.display = "block";
        loadLastUpdatedNew();
      }
    }

    async function loadLastUpdated() {
      try {
        const res = await fetch(`data/last_updated.json?t=${Date.now()}`);
        const meta = await res.json();
        document.getElementById("last-updated").textContent =
          `آخر تحديث: ${meta.date} — عدد الأدوية: ${meta.count.toLocaleString("ar-EG")}`;

        const downloadBtn = document.getElementById("download-btn");
        downloadBtn.href = `data/${meta.datedFileName}`;
        downloadBtn.setAttribute("download", meta.datedFileName);
      } catch (e) {
        document.getElementById("last-updated").textContent = "لسه مفيش نسخة متاحة";
      }
    }

    async function loadLastUpdatedNew() {
      try {
        const res = await fetch(`data/last_updated_new.json?t=${Date.now()}`);
        const meta = await res.json();
        document.getElementById("last-updated-new").textContent =
          `آخر تحديث: ${meta.date} — عدد الأدوية: ${meta.count.toLocaleString("ar-EG")}`;

        const downloadBtnNew = document.getElementById("download-btn-new");
        downloadBtnNew.href = `data/${meta.datedFileName}`;
        downloadBtnNew.setAttribute("download", meta.datedFileName);
      } catch (e) {
        document.getElementById("last-updated-new").textContent = "لسه مفيش نسخة متاحة";
      }
    }

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("mdl_token");
      if (token) {
        try { await fetch(`${WEB_APP_URL}?action=logout&token=${encodeURIComponent(token)}`); } catch (err) {}
      }
      localStorage.removeItem("mdl_token");
      localStorage.removeItem("mdl_user");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
