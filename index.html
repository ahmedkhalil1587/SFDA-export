<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFDA Updates</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
      color: #6b7280;
    }
    .topbar .user-name { font-weight: 600; color: #1a1a2e; }
    .topbar a {
      color: #0b5ed7;
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #0b5ed7;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover {
      background: #0a4fb5;
    }
    .meta {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
    #app { display: none; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="topbar">
      <span>أهلاً، <span class="user-name" id="user-name"></span></span>
      <span>
        <a href="admin.html" id="admin-link" style="display:none;">لوحة الأدمن</a>
        <a href="#" id="logout-link" style="margin-right:10px;">خروج</a>
      </span>
    </div>
    <h1>قائمة الأدوية البشرية المسجلة</h1>
    <p>آخر نسخة محدّثة تلقائيًا من موقع الهيئة العامة للغذاء والدواء (SFDA)</p>
    <a class="btn" href="data/SFDA_Drugs_latest.xlsx" download id="download-btn">
      تحميل آخر نسخة (Excel)
    </a>
    <div class="meta" id="last-updated">
      يتم تحديث الملف تلقائيًا أول كل شهر
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbys4Ak1MaJY2-K5r3WgZ1NWiqGonafK1emuhmNLolyrAeZAe8Pfg0UocD3v21UEofpoYg/exec";

    (async function guardPage() {
      const token = localStorage.getItem("mdl_token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(`${WEB_APP_URL}?action=checkSession&token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.success) {
          localStorage.removeItem("mdl_token");
          localStorage.removeItem("mdl_user");
          window.location.href = "login.html";
          return;
        }

        document.getElementById("user-name").textContent = data.user.name;
        if (data.user.role === "Admin") {
          document.getElementById("admin-link").style.display = "inline";
        }
        document.getElementById("app").style.display = "block";
        loadLastUpdated();
      } catch (e) {
        window.location.href = "login.html";
      }
    })();

    async function loadLastUpdated() {
      try {
        const res = await fetch(`data/last_updated.json?t=${Date.now()}`);
        const meta = await res.json();
        document.getElementById("last-updated").textContent =
          `آخر تحديث: ${meta.date} — عدد الأدوية: ${meta.count.toLocaleString("ar-EG")}`;

        const downloadBtn = document.getElementById("download-btn");
        downloadBtn.href = `data/${meta.datedFileName}`;
        downloadBtn.setAttribute("download", meta.datedFileName);
      } catch (e) {
        // لو الملف مش موجود لسه (أول تشغيلة ما خلصتش)، سيبي النص الافتراضي
      }
    }

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("mdl_token");
      if (token) {
        try { await fetch(`${WEB_APP_URL}?action=logout&token=${encodeURIComponent(token)}`); } catch (err) {}
      }
      localStorage.removeItem("mdl_token");
      localStorage.removeItem("mdl_user");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
