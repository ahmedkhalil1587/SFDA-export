<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الأدمن - SFDA Updates</title>
<link rel="icon" type="image/jpeg" href="assets/integriox-badge.jpeg" />
<style>
  :root {
    --accent: #0b5ed7;
    --ink: #171923;
    --muted: #6b7280;
    --border: #e6e8ec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    margin: 0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #eaf2fd 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #eef1f6 0%, transparent 55%),
      #f6f7f9;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    max-width: 800px;
    width: 100%;
  }
  .brand-header {
    text-align: center;
    margin-bottom: 14px;
  }
  .brand-header img {
    max-width: 116px;
    width: 100%;
    height: auto;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .topbar a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .topbar a:hover { text-decoration: underline; }
  h1 {
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 12px 32px -8px rgba(16,24,40,0.10);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 14px 18px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: #fbfbfc;
    color: var(--muted);
    font-weight: 700;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fbfbfc; }
  .badge {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge.active { background: #e5f7ec; color: #1a8a4a; }
  .badge.disabled { background: #fdecec; color: #d64545; }
  .badge.pending { background: #fff4e0; color: #b3711a; }
  .role-admin { color: var(--accent); font-weight: 700; }
  button.toggle {
    padding: 7px 14px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  button.toggle:hover { opacity: 0.85; }
  button.toggle.disable { background: #fdecec; color: #d64545; }
  button.toggle.enable { background: #e5f7ec; color: #1a8a4a; }
  button.toggle:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .msg.error { color: #d64545; }
  .footer-brand {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    color: #a7adb8;
    letter-spacing: 0.2px;
  }
  .settings-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 12px 32px -8px rgba(16,24,40,0.10);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .settings-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .settings-hint {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .setting-row:first-of-type { border-top: none; padding-top: 0; }
  .setting-label {
    font-size: 13.5px;
    color: var(--ink);
    font-weight: 600;
  }
  .setting-toggle {
    padding: 6px 16px;
    border-radius: 8px;
    border: none;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .setting-toggle:hover { opacity: 0.85; }
  .setting-toggle.on { background: #e5f7ec; color: #1a8a4a; }
  .setting-toggle.off { background: #fdecec; color: #d64545; }
  .setting-toggle:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="brand-header">
        <img src="assets/integriox-logo-light.jpeg" alt="integriox" />
      </div>
      <div class="topbar">
        <a href="index.html">→ رجوع</a>
        <a href="#" id="logout-link">خروج</a>
      </div>
      <div class="settings-card">
        <div class="settings-title">مصادر التحميل الظاهرة للمستخدمين</div>
        <div class="settings-hint">تحكّمي في أي مصدر يظهر في صفحة التحميل الرئيسية</div>
        <div class="setting-row">
          <span class="setting-label">الموقع القديم (oldsfda)</span>
          <button class="setting-toggle" id="toggle-old" data-key="show_old_source">...</button>
        </div>
        <div class="setting-row">
          <span class="setting-label">الموقع الجديد (sfda.gov.sa)</span>
          <button class="setting-toggle" id="toggle-new" data-key="show_new_source">...</button>
        </div>
      </div>

      <h1>إدارة اليوزرات</h1>
      <div class="card">
        <div id="content">
          <div class="msg">جاري التحميل...</div>
        </div>
      </div>
    </div>
    <div class="footer-brand">Powered by integriox</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbys4Ak1MaJY2-K5r3WgZ1NWiqGonafK1emuhmNLolyrAeZAe8Pfg0UocD3v21UEofpoYg/exec";
    const token = localStorage.getItem("mdl_token");
    const content = document.getElementById("content");

    if (!token) {
      window.location.href = "login.html";
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=listUsers&token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.success) {
          content.innerHTML = `<div class="msg error">${data.message || "مش متاح ليك تدخل هنا"}</div>`;
          return;
        }

        renderUsers(data.users);
      } catch (e) {
        content.innerHTML = `<div class="msg error">مشكلة في الاتصال، حاول تاني</div>`;
      }
    }

    function renderUsers(users) {
      if (!users.length) {
        content.innerHTML = `<div class="msg">مفيش يوزرات مسجلة</div>`;
        return;
      }

      const rows = users.map((u) => {
        const isActive = u.status === "Active";
        const isPending = u.status === "Pending";
        const badgeClass = isActive ? "active" : (isPending ? "pending" : "disabled");
        const badgeText = isActive ? "مفعّل" : (isPending ? "بانتظار الموافقة" : "موقوف");
        const roleClass = u.role === "Admin" ? "role-admin" : "";
        const btnClass = isActive ? "disable" : "enable";
        const btnText = isActive ? "إيقاف" : (isPending ? "الموافقة والتفعيل" : "تفعيل");
        const newStatus = isActive ? "Disabled" : "Active";

        return `
          <tr data-email="${u.email}">
            <td>${u.name}</td>
            <td style="direction:ltr; text-align:left;">${u.email}</td>
            <td class="${roleClass}">${u.role}</td>
            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            <td>
              <button class="toggle ${btnClass}" data-email="${u.email}" data-status="${newStatus}">
                ${btnText}
              </button>
            </td>
          </tr>
        `;
      }).join("");

      content.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الإيميل</th>
              <th>الدور</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll("button.toggle").forEach((btn) => {
        btn.addEventListener("click", () => toggleUser(btn));
      });
    }

    async function toggleUser(btn) {
      const email = btn.dataset.email;
      const newStatus = btn.dataset.status;
      btn.disabled = true;
      btn.textContent = "لحظة...";

      try {
        const res = await fetch(
          `${WEB_APP_URL}?action=setUserStatus&token=${encodeURIComponent(token)}&targetEmail=${encodeURIComponent(email)}&status=${encodeURIComponent(newStatus)}`
        );
        const data = await res.json();

        if (data.success) {
          loadUsers();
        } else {
          alert(data.message || "حصل خطأ");
          btn.disabled = false;
        }
      } catch (e) {
        alert("مشكلة في الاتصال");
        btn.disabled = false;
      }
    }

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      try { await fetch(`${WEB_APP_URL}?action=logout&token=${encodeURIComponent(token)}`); } catch (err) {}
      localStorage.removeItem("mdl_token");
      localStorage.removeItem("mdl_user");
      window.location.href = "login.html";
    });

    async function loadSettings() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getSettings`);
        const data = await res.json();
        if (data.success) renderToggle("toggle-old", data.settings.show_old_source !== false);
        if (data.success) renderToggle("toggle-new", data.settings.show_new_source !== false);
      } catch (e) {
        renderToggle("toggle-old", true);
        renderToggle("toggle-new", true);
      }
    }

    function renderToggle(id, isOn) {
      const btn = document.getElementById(id);
      btn.classList.remove("on", "off");
      btn.classList.add(isOn ? "on" : "off");
      btn.textContent = isOn ? "ظاهر" : "مخفي";
      btn.dataset.current = isOn ? "true" : "false";
    }

    async function toggleSetting(btn) {
      const key = btn.dataset.key;
      const newValue = btn.dataset.current === "true" ? "false" : "true";
      btn.disabled = true;
      btn.textContent = "...";

      try {
        const res = await fetch(
          `${WEB_APP_URL}?action=updateSetting&token=${encodeURIComponent(token)}&key=${encodeURIComponent(key)}&value=${newValue}`
        );
        const data = await res.json();
        if (data.success) {
          renderToggle(btn.id, newValue === "true");
        } else {
          alert(data.message || "حصل خطأ");
        }
      } catch (e) {
        alert("مشكلة في الاتصال");
      }
      btn.disabled = false;
    }

    document.getElementById("toggle-old").addEventListener("click", (e) => toggleSetting(e.target));
    document.getElementById("toggle-new").addEventListener("click", (e) => toggleSetting(e.target));

    loadSettings();
    loadUsers();
  </script>
</body>
</html>
